<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paperclip Factory</title>
<style>
  :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
  body { margin: 0; }
  main { max-width: 26rem; margin: 7vh auto; padding: 1.25rem; }
  h1, p { margin: 0 0 1rem; }
  output { display: block; font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  button { display: block; box-sizing: border-box; width: 100%; min-height: 44px; margin: .5rem 0; font: inherit; }
  .primary { min-height: 68px; font-weight: 700; }
  .primary svg { vertical-align: middle; width: 1.45em; height: 1.45em; margin-right: .35em; }
</style>
</head>
<body>
<main>
  <h1>Paperclip Factory</h1>
  <p><output id="clips" aria-label="Paperclips">0</output> paperclips</p>
  <button class="primary" id="make"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 13l6-6a2 2 0 0 1 3 3l-8 8a4 4 0 0 1-6-6l9-9a6 6 0 0 1 9 9l-8 8"/></svg>Make a paperclip</button>
  <button id="buy" aria-label="Buy a machine" disabled>Buy a machine (10 clips)</button>
  <button id="auto" aria-label="Automation" aria-pressed="false" disabled>Automation: off</button>
  <p id="rate">0 machines · 0 clips/sec</p>
  <p id="goal" role="status">Goal: hold 100 paperclips.</p>
  <button id="reset">Restart</button>
</main>
<script>
const clips = document.getElementById("clips");
const make = document.getElementById("make");
const buy = document.getElementById("buy");
const auto = document.getElementById("auto");
const rate = document.getElementById("rate");
const goal = document.getElementById("goal");
const reset = document.getElementById("reset");
let count = 0, machines = 0, timer, reached = false;
const cost = () => 10 + machines * 5;

function render() {
  clips.value = String(count);
  buy.textContent = "Buy a machine (" + cost() + " clips)";
  buy.disabled = count < cost();
  auto.disabled = machines === 0;
  auto.textContent = timer === undefined ? "Automation: off" : "Automation: on";
  auto.setAttribute("aria-pressed", String(timer !== undefined));
  rate.textContent = machines + (machines === 1 ? " machine" : " machines") + " · " +
    (timer === undefined ? 0 : machines) + " clips/sec";
  if (!reached && count >= 100) {
    reached = true;
    goal.textContent = "Goal reached! Keep making clips or restart.";
  }
}

function stopAutomation() {
  clearInterval(timer);
  timer = undefined;
}

make.addEventListener("click", () => { count++; render(); });
buy.addEventListener("click", () => {
  if (count < cost()) return;
  count -= cost();
  machines++;
  render();
});
auto.addEventListener("click", () => {
  if (!machines) return;
  if (timer === undefined) timer = setInterval(() => { count += machines; render(); }, 1000);
  else stopAutomation();
  render();
});
reset.addEventListener("click", () => {
  stopAutomation();
  count = machines = 0;
  reached = false;
  goal.textContent = "Goal: hold 100 paperclips.";
  render();
});
render();
</script>
</body>
</html>
