name: Check
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -B tools/check.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests/browser --ignore-scripts
      - run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Scenario e2e tests (every starter's SCENARIOS.md, one test per scenario)
        run: node tests/e2e.cjs
      - name: 'Testing protocol (test-core): scenarios ran and passed, control coverage, flaky patterns'
        run: sh tests/protocol.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaming-previews
          path: .test-output/e2e/
